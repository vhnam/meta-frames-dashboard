name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true
      - run: vp check
      - run: vp test
      - run: vp run build
      - run: pnpm audit --prod --audit-level high
