allowBuilds:
  "@ladybugdb/core": true
  gitnexus: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  tree-sitter-c-sharp: false
  tree-sitter-cpp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-php: false
  tree-sitter-python: false
  tree-sitter-ruby: false
  tree-sitter-rust: false
  "@scarf/scarf": false
  protobufjs: false
  onnxruntime-node: false
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
  # stylus 0.57 pulls css -> source-map-resolve -> decode-uri-component 0.2.2 (CVE-2026-118664).
  # 0.64 drops that chain. Only postcss-styl (shadcn-vue CLI) pins ^0.57.
  "stylus@^0.57.0": ^0.64.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
